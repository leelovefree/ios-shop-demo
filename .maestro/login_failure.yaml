appId: com.qademo.iosshopdemo
---
- launchApp
- assertVisible:
    id: login_screen
- tapOn:
    id: login_email_field
- inputText: "wrong@shop.com"
- tapOn:
    id: login_password_field
- inputText: "wrongpass"
- tapOn:
    id: login_submit_button
- assertVisible:
    id: login_error_message
- assertNotVisible:
    id: home_screen
