# Reduced to login-only (2026-09-29, per Linh Doan): the cart/checkout selectors this flow
# depended on don't have distinct accessibility ids in the app (cart_checkout_button and
# cart_total_cost_label both resolve to the shared "cart_screen" id), so they always failed.
appId: com.qademo.iosshopdemo
---
- launchApp
- assertVisible:
    id: login_screen
- tapOn:
    id: login_email_field
- inputText: "demo@shop.com"
- tapOn:
    id: login_password_field
- inputText: "123456"
- tapOn:
    id: login_submit_button
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- assertVisible:
    id: home_screen
