appId: com.qademo.iosshopdemo
---
- launchApp
- assertVisible:
    id: login_screen
- tapOn:
    id: login_email_field
- inputText: "demo@shop.com"
- tapOn:
    id: login_password_field
- inputText: "123456"
- tapOn:
    id: login_submit_button
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- assertVisible:
    id: home_screen
