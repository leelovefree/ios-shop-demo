name: ShopDemo
options:
  bundleIdPrefix: com.qademo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_PREVIEWS: true

targets:
  ShopDemo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qademo.iosshopdemo
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_CFBundleDisplayName: "Shop Demo"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ShopDemoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/ShopDemoTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qademo.iosshopdemo.tests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: ShopDemo

schemes:
  ShopDemo:
    build:
      targets:
        ShopDemo: all
        ShopDemoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShopDemoTests
