name: CI Regression (Stage 6 — zero AI calls, do not add any LLM step to this file)

on:
  pull_request:
    paths:
      - 'qa-tests/**'
      - '.maestro/**'
  schedule:
    - cron: '0 3 * * *'   # nightly
  workflow_dispatch: {}

jobs:
  regression:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select an available Xcode
        run: |
          ls /Applications | grep -i xcode
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install build + test tooling
        run: |
          brew install xcodegen openjdk@17
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "JAVA_HOME=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home" >> "$GITHUB_ENV"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/openjdk@17/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Boot simulator and build the app
        env:
          SIM_NAME: iPhone 16
        run: |
          xcrun simctl boot "$SIM_NAME" || true
          xcrun simctl bootstatus "$SIM_NAME" -b
          xcodebuild -project ShopDemo.xcodeproj -scheme ShopDemo \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -derivedDataPath build build

      - name: Install app on simulator
        env:
          SIM_NAME: iPhone 16
        run: |
          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -1)
          xcrun simctl install "$SIM_NAME" "$APP_PATH"

      - name: Run pipeline-managed tests (qa-tests/)
        run: |
          mapfile -t flows < <(find qa-tests -name '*.yaml')
          if [ "${#flows[@]}" -gt 0 ]; then
            maestro test "${flows[@]}"
          else
            echo "No pipeline-managed test cases yet (qa-tests/ is empty pre-Phase-2) — skipping, this is expected."
          fi

      - name: Run existing informal smoke flows (.maestro/)
        run: maestro test .maestro/
